<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>columns</title>
  <!-- tailwindcss v3.3.2 - https://tailwindcss.com via js -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <main>
    with tailwind
    <div class="columns-2 gap-4">
      <div class="bg-gray-200 p-4">Column 1</div>
      <div class="bg-gray-300 p-4">Column 2</div>
    </div>
    with plain css w/ columns property<br/> 
    https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/columns
    <div style="column-count: 2; column-gap: 1rem;">
      <div style="background-color: #e5e7eb; padding: 1rem;">Column 1</div>
      <div style="background-color: #d1d5db; padding: 1rem;">Column 2</div>
    </div>
    with css using flexbox
    <style>
        .flex-columns {
          display: flex;
          gap: 1rem;
        }
        .flex-columns > div {
          flex: 1;
        }
        .column {
          background-color: #e5e7eb;
          padding: 1rem;
        }
    </style>
    <div class="flex-columns">
      <div class="column">Column 1</div>
      <div class="column">Column 2</div>
    </div>
  </main>
</body>
</html>
