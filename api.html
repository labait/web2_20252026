<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://assets.incode.it/gsap-business/minified/SplitText.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js" integrity="sha512-uOtp2vx2X/5+tLBEf5UoQyqwAkFZJBM5XwGa7BfXDnWR+wdpRvlSVzaIVcRe3tGNsStu6UMDCeXKEnr4IBT8gA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">

  <style>
    section .title{
      font-size: 10vw;
      font-family: "DM Serif Text", serif;
    }
    #section1 .title{
      font-size: 5vw;
    }

  </style>
</head>
<body>
  <main>
    <section section class="h-screen flex items-center justify-center border-solid border-2 border-black">
      <h1 id="phrase1" class="font-bold text-center text-[4vw] leading-snug px-20"></h1>
    </section>
    <section id="section1" class="h-screen flex items-center justify-center border-solid border-2 border-black">
      <div class="title  font-bold text-center leading-snug p-10">
        La miglior vendetta? La felicità
        Non c'è niente che faccia più impazzire
        la gente che vederti felice...
      </div>
    </section>
    <section id="section2" class="h-screen flex items-center justify-center border-solid border-2 border-black">
      <div class="title h-screen flex items-center justify-center font-bold ">
        section2
      </div>
    </section>
    <section id="section3" class="h-screen flex items-center justify-center border-solid border-2 border-black">
      <div class="title h-screen flex items-center justify-center font-bold ">
        section3
      </div>
    </section>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const request = await fetch('https://api.chucknorris.io/jokes/random')
      const data = await request.json();
      console.log(data);
      const phrase1 = document.getElementById('phrase1');
      phrase1.textContent = data.value;
     
    });

  </script>

</body>
</html>
